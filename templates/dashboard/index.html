
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Logística Central</title>
</head>
<body>

    <h1>Dashboard administrativo</h1>

    <p>Bienvenido, {{ current_user.nombre }}.</p>

    <p>Has iniciado sesión como administrador.</p>

    <form method="POST" action="{{ url_for('autenticacion.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Cerrar sesión</button>
    </form>

    <a href="{{ url_for('dashboard.listar_empleados') }}">
    Gestionar empleados
</a>

<a href="{{ url_for('dashboard.crear_empleado') }}">
    Registrar empleado
</a>

</body>
</html>
