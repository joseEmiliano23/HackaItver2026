
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar empleado - Logística Central</title>
</head>
<body>

    <h1>Registrar nuevo empleado</h1>

    <a href="{{ url_for('dashboard.listar_empleados') }}">
        Volver a empleados
    </a>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <p>{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" required>

        <br><br>

        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" maxlength="40" required>

        <br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <br><br>

        <label for="rol">Tipo de empleado:</label>
        <select name="rol" id="rol" required>
            <option value="OPERADOR">Operador</option>
            <option value="JEFE_EMBARQUE">Jefe de embarque</option>
        </select>

        <br><br>

        <button type="submit">Registrar empleado</button>

    </form>

</body>
</html>
